# The home server setup. From the repo root:
#   Start:  docker compose up -d --build
#   Stop:   docker compose down
#   Status: docker compose ps
#   Logs:   docker compose logs -f
#
# For development, see compose.dev.yaml.

name: smart-home

services:
  reminders-api:
    build: ./apps/api/reminders_api
    restart: unless-stopped
    environment:
      REMINDERS_DATABASE_PATH: /data/reminders.db
      # The time zone whose clocks repeating reminders follow, so that one due at 09:00 stays at 09:00 when they change.
      HOME_TIME_ZONE: Europe/London
    ports:
      # The API has no login, so it is only reachable from this machine by default. To let other devices reach it, set
      # REMINDERS_API_BIND_ADDRESS to this machine's LAN address in a git-ignored .env file next to this one.
      - "${REMINDERS_API_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - reminders-data:/data
    networks:
      - default
      - alexa

  # Holds the presets for the ADHD timer page.
  timers-api:
    build: ./apps/api/timers_api
    restart: unless-stopped
    environment:
      TIMERS_DATABASE_PATH: /data/timers.db
    ports:
      # Like the reminders API, this has no login, so the same advice applies. Set TIMERS_API_BIND_ADDRESS to let other
      # devices reach it.
      - "${TIMERS_API_BIND_ADDRESS:-127.0.0.1}:8001:8000"
    volumes:
      - timers-data:/data
    networks:
      - default
      - alexa

  # Every page for the home's screens: the reminders viewer, dashboards, and so on.
  home-web:
    build:
      context: ./apps/home_web
      additional_contexts:
        # The Alexa controls page is built from the skill's own files, so that it always describes this commit's skill.
        alexa-skill: ./apps/api/alexa_api/skill
    restart: unless-stopped
    depends_on:
      reminders-api:
        condition: service_healthy
      timers-api:
        condition: service_healthy
    ports:
      # Like the APIs, the pages have no login, so the same advice applies. Set KIOSK_VIEWER_BIND_ADDRESS to let other
      # devices reach them.
      - "${KIOSK_VIEWER_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    extra_hosts:
      # nginx forwards the site editor page's calls to the site editor API, which runs on this machine rather than in
      # a container (see start_site_editor.bat). Docker Desktop defines this name by itself; naming it here makes it
      # work on plain Docker too, and nginx won't start if it can't look the name up.
      - "host.docker.internal:host-gateway"

  # Lets people work the home by talking to an Echo: reminders, the timer and the site editor. Amazon sends what they
  # say to the home's Alexa skill (apps/api/alexa_api/skill) here, through the tunnel below.
  # Unlike everything else, this is reachable from the internet without a login, because Alexa can't log in. It
  # refuses every request that Amazon didn't sign for this skill, and the rest of this entry limits what a flaw in it
  # could be used for: it can't change its own files, has no special permissions, and is on a network of its own
  # with only the APIs that it uses.
  alexa-api:
    build: ./apps/api/alexa_api
    restart: unless-stopped
    environment:
      # Amazon's id for the skill, which is not a secret. `ask deploy` wrote it to
      # apps/api/alexa_api/skill/.ask/ask-states.json when it created the skill; it only changes if the skill is
      # deleted and created again.
      ALEXA_SKILL_ID: amzn1.ask.skill.1c28046b-ed3c-42d3-a607-aa8274598990
      REMINDERS_API_URL: http://reminders-api:8000
      TIMERS_API_URL: http://timers-api:8000
      # The site editor API runs on the machine itself rather than in a container (see start_site_editor.bat).
      SITE_EDITOR_API_URL: http://host.docker.internal:8002
      # The time zone that people mean when they tell Alexa a time.
      HOME_TIME_ZONE: Europe/London
    depends_on:
      reminders-api:
        condition: service_healthy
      timers-api:
        condition: service_healthy
    extra_hosts:
      # Docker Desktop defines this name by itself; naming it here makes it work on plain Docker too.
      - "host.docker.internal:host-gateway"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - alexa

  # Makes the pages reachable from outside the home, through a Cloudflare Tunnel. It connects out to Cloudflare, so no
  # router ports need opening, and it reaches home-web over this file's network, so the port above can stay private.
  # Anyone can reach the tunnel's public hostname, so it relies on Cloudflare Access, set up in the Zero Trust
  # dashboard, to ask visitors to log in; nothing here enforces that.
  # The tunnel and its hostnames are set up in the dashboard too. Put its token in the git-ignored .env file as
  # CLOUDFLARE_TUNNEL_TOKEN.
  # A second hostname, alexa.joeygw.uk, leads to alexa-api. It must stay outside Cloudflare Access, and it doesn't
  # wait for alexa-api to be healthy, so that a problem there can't take the pages down with it.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      home-web:
        condition: service_healthy
    networks:
      - default
      - alexa

networks:
  # Holds only what alexa-api needs to reach, or be reached by.
  alexa:

volumes:
  reminders-data:
  timers-data:
