# The home server setup. From the repo root:
#   Start:  docker compose up -d --build
#   Stop:   docker compose down
#   Status: docker compose ps
#   Logs:   docker compose logs -f
#
# For development, see compose.dev.yaml.

name: smart-home

services:
  reminders-api:
    build: ./apps/api/reminders_api
    restart: unless-stopped
    environment:
      REMINDERS_DATABASE_PATH: /data/reminders.db
    ports:
      # The API has no login, so it is only reachable from this machine by default. To let other devices reach it, set
      # REMINDERS_API_BIND_ADDRESS to this machine's LAN address in a git-ignored .env file next to this one.
      - "${REMINDERS_API_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - reminders-data:/data

  # Holds the presets for the ADHD timer page.
  timers-api:
    build: ./apps/api/timers_api
    restart: unless-stopped
    environment:
      TIMERS_DATABASE_PATH: /data/timers.db
    ports:
      # Like the reminders API, this has no login, so the same advice applies. Set TIMERS_API_BIND_ADDRESS to let other
      # devices reach it.
      - "${TIMERS_API_BIND_ADDRESS:-127.0.0.1}:8001:8000"
    volumes:
      - timers-data:/data

  # Every page for the home's screens: the reminders viewer, dashboards, and so on.
  home-web:
    build: ./apps/home_web
    restart: unless-stopped
    depends_on:
      reminders-api:
        condition: service_healthy
      timers-api:
        condition: service_healthy
    ports:
      # Like the APIs, the pages have no login, so the same advice applies. Set KIOSK_VIEWER_BIND_ADDRESS to let other
      # devices reach them.
      - "${KIOSK_VIEWER_BIND_ADDRESS:-127.0.0.1}:8080:8080"

  # Makes the pages reachable from outside the home, through a Cloudflare Tunnel. It connects out to Cloudflare, so no
  # router ports need opening, and it reaches home-web over this file's network, so the port above can stay private.
  # Anyone can reach the tunnel's public hostname, so it relies on Cloudflare Access, set up in the Zero Trust
  # dashboard, to ask visitors to log in; nothing here enforces that.
  # The tunnel and its hostnames are set up in the dashboard too. Put its token in the git-ignored .env file as
  # CLOUDFLARE_TUNNEL_TOKEN.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      home-web:
        condition: service_healthy

volumes:
  reminders-data:
  timers-data:
