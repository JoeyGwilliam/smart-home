# Serves the built app, and forwards /api to the reminders API so that the browser only ever talks to this origin.
# vite.config.ts does the same forwarding in development.
server {
    listen 8080;

    root /usr/share/nginx/html;

    location /api/ {
        # The trailing slash strips the /api prefix, so /api/reminders reaches the API as /reminders.
        proxy_pass http://reminders-api:8000/;
    }

    # Open pages fetch this every second to spot a new deploy (see src/deploy/useReloadOnNewBuild.ts).
    # Logging each check would bury everything else in the log.
    location = /build-id.json {
        access_log off;
        add_header Cache-Control "no-store";
    }

    # The page must always be revalidated, so that a reload after a deploy picks up the new build's assets.
    # Those assets have hashed names, so they can still be cached as normal.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        # Unknown paths fall back to the app, so that a page refresh works on any route the app defines.
        try_files $uri /index.html;
    }
}
