# Serves the built app, and forwards /api to the APIs so that the browser only ever talks to this origin.
# vite.config.ts does the same forwarding in development.
server {
    listen 8080;

    root /usr/share/nginx/html;

    # nginx picks the longest matching prefix, so this and the next block take their APIs' calls from the last one.
    location /api/timers/ {
        # The trailing slash strips the prefix, so /api/timers/presets reaches the API as /presets.
        proxy_pass http://timers-api:8000/;
    }

    # The site editor API runs on the machine itself rather than in a container (see start_site_editor.bat), so it is
    # reached through the name Docker gives the host. The site works without it; only the site editor page needs it.
    location /api/site-editor/ {
        proxy_pass http://host.docker.internal:8002/;
    }

    location /api/ {
        # The trailing slash strips the /api prefix, so /api/reminders reaches the API as /reminders.
        proxy_pass http://reminders-api:8000/;
    }

    # Open pages fetch this every second to spot a new deploy (see src/deploy/useReloadOnNewBuild.ts).
    # Logging each check would bury everything else in the log.
    location = /build-id.json {
        access_log off;
        add_header Cache-Control "no-store";
    }

    # The page must always be revalidated, so that a reload after a deploy picks up the new build's assets.
    # Those assets have hashed names, so they can still be cached as normal.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        # Unknown paths fall back to the app, so that a page refresh works on any route the app defines.
        try_files $uri /index.html;
    }
}
