[project]
name = "alexa-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "certifi>=2026.1.4",
    "cryptography>=46.0.0",
    "fastapi[standard]>=0.162.2",
    "httpx>=0.28.1",
    "tzdata>=2025.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
