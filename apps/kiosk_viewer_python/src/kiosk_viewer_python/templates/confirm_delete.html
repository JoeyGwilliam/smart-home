{% extends "base.html" %}

{% block title %}Delete reminder{% endblock %}

{% block content %}
  <section class="notice">
    <h1>Delete this reminder?</h1>
    <p class="notice__subject">{{ reminder.title }}</p>
    <p class="notice__text">This can't be undone.</p>
    <div class="notice__actions">
      <a class="button" href="/">Cancel</a>
      <form method="post" action="/reminders/{{ reminder.id }}/delete">
        <button class="button button--danger" type="submit">Delete</button>
      </form>
    </div>
  </section>
{% endblock %}
