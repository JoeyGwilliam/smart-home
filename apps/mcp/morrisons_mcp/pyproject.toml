[project]
name = "morrisons-mcp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.0",
    "playwright>=1.50",
    "websockets>=15",
]

[project.scripts]
morrisons-mcp = "morrisons_mcp.server.main:run"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
