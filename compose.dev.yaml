# Development settings, layered on top of compose.yaml. From the repo root:
#   Start: docker compose -f compose.yaml -f compose.dev.yaml up --build
#   Stop:  Ctrl+C, then docker compose -f compose.yaml -f compose.dev.yaml down
#
# This is a separate file, rather than an automatically loaded compose.override.yaml, so that the home server can never
# pick up these settings by accident.

services:
  # Development stays on this machine, so the tunnel never starts. Its profile is never activated.
  cloudflared:
    profiles: ["home-server-only"]

  # Alexa can only reach this through the tunnel, so it never starts either.
  alexa-api:
    profiles: ["home-server-only"]

  reminders-api:
    restart: "no"
    # Windows file changes don't reach containers as events, so the reloader has to poll for them.
    command: uvicorn reminders_api.api.create_app:create_app_from_environment --factory --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./apps/api/reminders_api/src:/app/src
      - ./.eggs/reminders_api:/data

  timers-api:
    restart: "no"
    command: uvicorn timers_api.api.create_app:create_app_from_environment --factory --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./apps/api/timers_api/src:/app/src
      - ./.eggs/timers_api:/data

  recipes-api:
    restart: "no"
    command: uvicorn recipes_api.api.create_app:create_app_from_environment --factory --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./apps/api/recipes_api/src:/app/src
      - ./.eggs/recipes_api:/data

  # This serves the pages as they were when it was built. To see changes to the pages as they are made, run
  # "npm run dev" in apps/home_web instead (see its README), which uses the three APIs above.
  home-web:
    restart: "no"
